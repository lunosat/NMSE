# --------------------------------------------------------------
# NMSE Release Build Workflow
#
# Builds, tests and packages the native Linux application, then
# creates a GitHub Release when version.json changes on the
# default branch.
#
# The publish is self-contained: users need neither .NET nor Wine.
# The previous workflow bundled a Wine installation around a
# Windows executable; the project targets net10.0 now and the UI
# is Avalonia, so the payload is a Linux binary.
#
# Packages produced:
#   - AppImage (x64, arm64) — single file, no install
#   - tar.gz   (x64, arm64) — extract and run, with install.sh
#   - Arch PKGBUILD is in packaging/ and is built by the AUR, not here
#   - Flatpak needs the binary published outside the sandbox, so it
#     is built from packaging/io.github.vectorcmdr.NMSE.yml locally
#
# The release step is additive: if a matching release already
# exists, only missing artifacts are uploaded — existing files,
# title and notes are preserved.
#
# All actions are pinned to immutable commit SHAs to mitigate
# supply-chain attacks. When upgrading, update both the SHA and
# the version comment.
# --------------------------------------------------------------

name: Build NMSE

env:
  PROJECT_NAME: NMSE
  PROJECT_FILE: NMSE.csproj
  TEST_PROJECT_FILE: NMSE.Tests/NMSE.Tests.csproj
  EXTRACTOR_TEST_FILE: NMSE.Extractor.Tests/NMSE.Extractor.Tests.csproj
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

# The release job creates tags and releases through GITHUB_TOKEN, which
# needs contents:write. Without it, repositories whose default workflow
# permission is "read" fail with HTTP 403.
permissions:
  contents: write

on:
  # -- Un/comment the push block below to enable automated releases --
  push:
    paths:
      - "version.json"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # The logic layer builds and tests without a display, so this runs
  # on its own and gates the packaging jobs.
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_FILE }} -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: |
          dotnet test ${{ env.TEST_PROJECT_FILE }} -c ${{ env.BUILD_CONFIGURATION }}
          dotnet test ${{ env.EXTRACTOR_TEST_FILE }} -c ${{ env.BUILD_CONFIGURATION }}

  # ---------------------------------------------------------------
  # One packaging job per architecture. arm64 is cross-published from
  # the x64 runner, which .NET supports for self-contained output.
  # ---------------------------------------------------------------
  package:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ImageMagick shrinks the 4,900 icons from 333 MB to 43 MB. The build
      # script skips the step and warns when it is missing, so a package
      # still comes out either way — just a much larger one.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libfuse2

      - name: Publish and stage
        run: ./packaging/build.sh --arch ${{ matrix.arch }}

      - name: Build tarball
        run: ./packaging/build-tarball.sh --arch ${{ matrix.arch }}

      # appimagetool needs FUSE to run its own AppImage, which the runner
      # has after libfuse2; the script downloads the tool itself.
      - name: Build AppImage
        run: ./packaging/build-appimage.sh --arch ${{ matrix.arch }}

      - name: Upload packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.PROJECT_NAME }}-linux-${{ matrix.arch }}
          path: |
            Build/dist/*.AppImage
            Build/dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Collects every architecture's packages into one release.
  # ---------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: package
    if: github.repository == 'vectorcmdr/NMSE'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.PROJECT_NAME }}-linux-*
          path: dist
          merge-multiple: true

      - name: Read version from version.json
        id: version
        run: |
          VERSION=$(python3 -c "
          import json
          v = json.load(open('version.json'))
          print(f\"{v['major']}.{v['minor']}.{v['patch']}\")")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  Tag: v$VERSION"

      - name: Build release notes
        id: notes
        run: |
          {
            [ -f release-notes.md ] && cat release-notes.md
            printf '\n\n---\n\n'
            printf '*Automated release **v%s** (build #%s) from `%s`*\n' \
              "${{ steps.version.outputs.VERSION }}" \
              "${{ github.run_number }}" \
              "${{ github.sha }}"
          } > release-body.md
          echo "NOTES_FILE=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.TAG }}"
          ver="${{ steps.version.outputs.VERSION }}"

          mapfile -t files < <(find dist -type f \( -name '*.AppImage' -o -name '*.tar.gz' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no packages to release" >&2
            exit 1
          fi
          printf 'Artifacts to release:\n'; printf '  %s\n' "${files[@]}"

          # Uploading only what is missing keeps a re-run from clobbering a
          # release someone has already edited.
          if existing=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "Release $tag already exists — uploading missing artifacts"
            for f in "${files[@]}"; do
              if grep -qxF "$(basename "$f")" <<< "$existing"; then
                echo "  Skipping $(basename "$f") (already in release)"
              else
                echo "  Uploading $(basename "$f")"
                gh release upload "$tag" "$f"
              fi
            done
          else
            echo "Creating new release $tag"
            gh release create "$tag" "${files[@]}" \
              --title "NMSE v${ver}" \
              --notes-file "${{ steps.notes.outputs.NOTES_FILE }}"
          fi
